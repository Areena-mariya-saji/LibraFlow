services:
  libraflow-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: libraflow-app:1.0.0
    container_name: libraflow-container
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=libraflow-compose-super-secure-key-2026
      - DATABASE_PATH=/app/data/libraflow.db
      - PORT=5000
      - LOAN_PERIOD_DAYS=14
      - FINE_PER_DAY=1.00
    volumes:
      - libraflow-db-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  libraflow-db-data:
    name: libraflow-persistent-storage
