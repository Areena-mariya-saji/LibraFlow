{% extends "base.html" %}

{% block title %}{{ error_code }} — {{ title }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm rounded-4 p-5">
        <div class="display-1 fw-bold text-danger mb-3">{{ error_code }}</div>
        <h3 class="fw-bold text-navy mb-2">{{ title }}</h3>
        <p class="text-muted mb-4">{{ message }}</p>
        <div>
          <a href="{{ url_for('index') }}" class="btn btn-primary fw-semibold px-4">
            <i class="fa-solid fa-house me-1"></i> Return Home
          </a>
          <button onclick="history.back()" class="btn btn-outline-secondary ms-2">
            <i class="fa-solid fa-arrow-left me-1"></i> Go Back
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
